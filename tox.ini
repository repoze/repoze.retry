[tox]
envlist = 
    py310,py311,py312,py313,py314,pypy3,w_deps,
    coverage,
    docs

isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
commands = 
    python --version
    python -mpytest --cov \
        {posargs:}
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:w_deps]
basepython =
    python3.14
deps =
    transaction
    ZODB
    Zope>=4.0
    pytest
    pytest-cov

[testenv:coverage]
skip_install = true
basepython =
    python3.14
commands = 
    coverage combine
    coverage report --fail-under=100 --show-missing
    coverage xml
deps =
    coverage
setenv =
    COVERAGE_FILE=.coverage
depends = py310,py314,pypy3,w_deps

[testenv:docs]
basepython =
    python3.14
commands = 
    sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html
deps =
    Sphinx

[testenv:lint]
skip_install = true
commands =
    ruff check
    ruff format --check
    check-manifest
dependency_groups =
    dev
